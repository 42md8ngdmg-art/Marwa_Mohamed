
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050407">
  <title>مفاجأة</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050407;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      color: white;
    }

    #app {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #050407;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #050407;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      text-align: center;
      padding: 28px;
      background: radial-gradient(
        ellipse at center,
        rgba(65, 10, 34, .52),
        rgba(5, 4, 7, .98) 68%
      );
      opacity: 0;
      visibility: hidden;
      transition: opacity .9s ease;
    }

    .screen.active {
      opacity: 1;
      visibility: visible;
    }

    #start {
      opacity: 1;
      visibility: visible;
    }

    #start.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    button {
      border: 1px solid rgba(255, 190, 210, .58);
      border-radius: 999px;
      padding: 14px 30px;
      color: #ffeaf0;
      background: rgba(255, 255, 255, .06);
      font-size: 17px;
      font-weight: 600;
      box-shadow: 0 0 26px rgba(255, 75, 125, .18);
      cursor: pointer;
    }

    #start p {
      font-size: 12px;
      color: #c7aab5;
      margin-top: 18px;
    }

    #end h1 {
      font-size: clamp(54px, 16vw, 86px);
      font-weight: 700;
      margin: 0;
      color: #ffe8ef;
      text-shadow:
        0 0 10px #ff789e,
        0 0 30px rgba(255, 50, 110, .75),
        0 0 65px rgba(255, 50, 110, .35);
      animation: appear 1.7s both;
    }

    #end .heart {
      font-size: 24px;
      color: #ff789e;
      margin-top: 20px;
      animation: pulse 1.6s ease-in-out infinite;
    }

    #end button {
      margin-top: 40px;
      font-size: 13px;
      padding: 10px 22px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(14px) scale(.92);
        filter: blur(8px);
      }
      to {
        opacity: 1;
        transform: none;
        filter: blur(0);
      }
    }

    @keyframes pulse {
      50% {
        transform: scale(1.18);
        text-shadow: 0 0 20px #ff5d88;
      }
    }
  </style>
</head>

<body>

<main id="app">

  <video id="original"
         playsinline
         webkit-playsinline
         preload="metadata">

    <source src="original.mp4" type="video/mp4">

  </video>

  <section id="start" class="screen active">
    <button id="go">ابدأ المفاجأة</button>
    <p>اضغط لبدء العرض</p>
  </section>

  <section id="end" class="screen">
    <h1>بحبك</h1>
    <div class="heart">♥</div>
    <button id="again">إعادة المفاجأة</button>
  </section>

  <section id="error" class="screen">
    <p>
      تعذّر تشغيل الفيديو.
      تأكد من وجود ملف original.mp4 بجانب صفحة HTML.
    </p>
    <button id="retry">حاول مرة أخرى</button>
  </section>

</main>

<script>
(() => {
  'use strict';

  const video = document.getElementById('original');

  const startScreen =
    document.getElementById('start');

  const endScreen =
    document.getElementById('end');

  const errorScreen =
    document.getElementById('error');

  async function playFromStart() {

    endScreen.classList.remove('active');
    errorScreen.classList.remove('active');

    startScreen.classList.add('hidden');

    try {

      video.pause();

      video.currentTime = 0;

      await video.play();

    } catch (error) {

      startScreen.classList.remove('hidden');

      errorScreen.classList.add('active');

    }
  }

  document.getElementById('go')
    .addEventListener('click', playFromStart);

  document.getElementById('again')
    .addEventListener('click', playFromStart);

  document.getElementById('retry')
    .addEventListener('click', playFromStart);

  video.addEventListener('ended', () => {

    endScreen.classList.add('active');

  });

  video.addEventListener('error', () => {

    startScreen.classList.remove('hidden');

    errorScreen.classList.add('active');

  });

})();
</script>

</body>
</html>
